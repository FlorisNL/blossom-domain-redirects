name: blossomact-redirect
region: ams
domains:
  - domain: blossomact.com
    type: PRIMARY
    wildcard: true
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
ingress:
  rules:
    - match:
        path:
          prefix: /
      redirect:
        uri: /
        authority: www.moreblossom.com
        scheme: https
        redirect_code: 301
